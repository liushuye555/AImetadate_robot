[project]
name = "qq-onebot-whitelist"
version = "0.1.0"
description = "QQ resource archive bot with OneBot v11 and QQ Open Platform transports"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12",
  "PyYAML>=6",
  "pillow>=12.3.0",
  "pypdf>=6.20.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
qq_onebot_whitelist = ["knowledge_background.json", "gallery.html"]
