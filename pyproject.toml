[project]
name = "qq-onebot-whitelist"
version = "0.1.0"
description = "OneBot/NapCat whitelist-mention bot, non-official QQ API route"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12",
  "PyYAML>=6",
  "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
