onebot:
  # NapCat/Lagrange 的 OneBot v11 正向 WebSocket 地址。
  ws_url: "ws://127.0.0.1:3001"

ui:
  # auto follows the Windows user language; supported explicit values: en-US, zh-CN.
  language: auto

listen:
  # 黑名单群：不记录、不分析、不回复。
  blocked_groups: []

reply:
  # 群聊默认必须直接 @ 机器人；私聊无需 @。
  require_at_in_group: true
  # 群主/管理员可触发回复，但群内仍受 require_at_in_group 约束。
  allow_group_admins: true
  whitelist_users:
    # - "你的QQ号"
  whitelist_groups:
    # - "允许触发回复的群号"

summary:
  default_limit: 100
  max_limit: 500

daily_report:
  enabled: true
  hour: 20
  max_links: 20
  enrich_links: true
  max_enriched_links: 8

features:
  # 原始消息和 URL 始终保留；以下开关只控制对应的后续处理。
  link_analysis: true
  link_metadata: true
  image_processing: true
  ai_context: true
  daily_report: true
  startup_history: true
  auto_restart: true
links:
  # 链接用途判定模式：rule（规则，零成本）| llm（DeepSeek 复核判不出用途的链接）| both
  link_judge: rule

keepalive:
  # 默认关闭；开启后仅向明确列出的群发送定时消息。
  enabled: false
  interval_minutes: 0
  groups: []
  message: ""

images:
  # 兼容旧配置；data/images/ai 是长期归档，不执行预算删除。
  max_archive_mb: 500
  # 只适用于 data/images/candidates 临时候选。
  candidate_ttl_hours: 24
  # 参数/模型讨论判定模式：rule（关键词，零成本）| llm（DeepSeek 复核）| both
  ai_discussion_judge: rule
  # 提示词绑定复核模式：rule（规则，零成本）| llm（DeepSeek 复核提示词文本）| both
  prompt_judge: rule
  # 机器人账号（QQ 号）：这些账号发的图片直接无视，例如 [2215149479]
  ignore_bot_user_ids: []

storage:
  data_dir: "data"

startup_history:
  enabled: true
  # blacklist = 自动获取群列表，跳过 listen.blocked_groups。
  mode: blacklist
  # false = 正常启动按游标增量追赶，遇到上次最新消息即停止。
  all: false
  max_pages: 200
  count: 50

ai_context:
  enabled: true
  provider: ds_v4_flash
  # all_groups = 所有非黑名单群。
  scopes: all_groups
  chunk_size: 200
  # 常驻 bot 每隔多少分钟检查一次新增消息。
  auto_interval_minutes: 15
  # 累计新增消息达到该值后触发增量分析。
  min_new_messages: 300
  # 只在这些本地时间窗口调用 LLM；留空 [] 表示全天允许。
  # 支持跨午夜窗口，例如 "23:00-07:00"。
  allowed_windows: []

backup:
  enabled: true
  # 快照目录（相对仓库根或绝对路径）。建议指向另一块物理盘防整盘故障。
  dir: data/backups
  # 轮换保留：最近 N 份日备（周一自动归为周备，另保留 N 份）。
  keep_daily: 3
  keep_weekly: 2
  # 目标盘剩余空间低于该值(MB)时跳过备份，不写满磁盘。
  min_free_mb: 2048
  # 图片异地镜像（35GB 级，首拷较慢，之后每天增量）。需要先设 images_dir 并确认目标盘空间。
  images: false
  # images_dir: E:/bot-backups

file_sync:
  # 群文件上云：下载群文件本体后经 WebDAV 上传（推荐对接 AList/OpenList，
  # 它把百度/阿里/OneDrive/123 等网盘统一挂成 WebDAV，后端随便换）。
  enabled: false
  # AList 的 WebDAV 地址与账号；账号密码也可直接写进 url（http://user:pass@host:5244/dav）
  webdav_url: http://127.0.0.1:5244/dav
  webdav_user: admin
  webdav_password: ""
  # 网盘里的目标目录：/<remote_dir>/<群名>/<年-月>/<文件名>
  remote_dir: QQ群文件
  # 下载暂存目录（上传成功后自动清理）
  staging_dir: data/file-staging
  # 单文件大小上限（GB），超出记 skipped 不上传
  max_file_gb: 10
  # 只同步这些群（群号列表）；留空 = 除 blocked_groups 外全部群
  groups: []

  # 定期用 NapCat 群文件列表接口补扫历史群文件
  backfill: true
  scan_interval_minutes: 360

# 群知识功能：全局默认关闭。启用全局开关后，仍需在 knowledge.groups 中
# 为具体群显式开启群开关及需要的子功能；新群不会自动启用。
knowledge:
  enabled: false
  defaults:
    match_mode: hybrid
    topics: []
    interval_minutes: 15
    min_new_messages: 30
    max_wait_minutes: 60
    batch_size: 100
    max_tokens_per_day: 50000
    summary:
      enabled: false
      daily: false
      weekly: false
    extraction:
      enabled: false
    # 自动过期必须在具体群组 lifecycle.enabled 中主动开启；默认值不启用功能。
    lifecycle:
      enabled: false
      brief_days: 3
      detailed_days: 14
      transient_days: 3
      resource_days: 30
    glossary:
      enabled: false
    files:
      enabled: false
      # 小文本、工作流JSON、ZIP文本成员和PDF仅做有界预览，不执行文件。
      preview_enabled: false
      max_file_mb: 512
      budget_gb: 20
      mode: high_value
    models:
      circuit_enabled: false
      failure_threshold: 3
      cooldown_seconds: 300
      tiered_enabled: false
      primary_provider: default
      primary_model: ""
      review_enabled: false
      review_provider: ds_v4_flash
      review_model: ""
    feedback:
      enabled: false
      optimization_enabled: false
    history:
      enabled: false
    notifications:
      enabled: false
  groups: {}
