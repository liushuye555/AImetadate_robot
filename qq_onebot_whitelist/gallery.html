<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片库 · 群资料库</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('viewTheme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}catch{}</script>
<style>
:root{color-scheme:dark;--bg:#111018;--panel:#1d1b27;--line:#363144;--text:#ece8f5;--muted:#b0a7bf;--accent:#bca8ed;--input:#16141f;--wall-a:rgba(17,16,24,.52);--wall-b:rgba(17,16,24,.6);--wall-c:rgba(17,16,24,.86)}
html[data-theme=light]{color-scheme:light;--bg:#f5f3fa;--panel:#fff;--line:#ded7ec;--text:#30283f;--muted:#726780;--accent:#6f50ae;--input:#faf8ff;--wall-a:rgba(245,243,250,.42);--wall-b:rgba(245,243,250,.55);--wall-c:rgba(245,243,250,.88)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif}a{color:var(--accent)}button,input,select{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:9px;background:var(--input);padding:9px 12px}button{cursor:pointer}button:hover,a:hover{color:var(--accent)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header,main{max-width:1600px;margin:auto;padding:22px 28px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header h1{margin:0;font-size:25px}nav{display:flex;gap:16px;flex:1;flex-wrap:wrap}nav a{text-decoration:none}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.filters label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.filters input,.filters select{width:100%;min-width:0}.wide{grid-column:span 2}.check{flex-direction:row!important;align-items:center}.check input{width:auto}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.toolbar .muted{flex:1}.primary{background:var(--accent);color:var(--bg);font-weight:650}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:8px;align-items:start;gap:10px}.card{overflow:hidden;border:0;border-radius:8px;background:transparent;align-self:start}.preview{display:block;position:relative;width:100%;background:transparent;padding:0;border:0;border-radius:0}.preview img{display:block;width:100%;height:auto}.preview.masked img{filter:blur(18px)}.preview.masked:after{content:'混淆还原图 · 点击显示';position:absolute;left:12px;bottom:12px;padding:3px 9px;border-radius:8px;background:var(--panel);color:var(--text);font-size:12px}.info{padding:12px}.info p{margin:3px 0;overflow-wrap:anywhere}.info .meta{font-size:12px;color:var(--muted)}.info pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;font:12px/1.7 system-ui}.badge{font-size:11px;color:var(--accent)}.pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:26px}.empty{text-align:center;padding:60px 10px;color:var(--muted)}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:min(960px,95vw);max-height:94vh;padding:22px}dialog::backdrop{background:#000b}dialog img{display:block;max-width:85vw;max-height:72vh;margin:auto}dialog form{display:grid;gap:14px;min-width:min(450px,75vw)}.dialog-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:15px}.error{color:#ee8e9b}#exportStatus{white-space:pre-wrap;overflow-wrap:anywhere}footer{padding:8px 28px 28px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}header,main{padding:16px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}@media(max-width:450px){.grid{grid-template-columns:1fr}.wide{grid-column:span 2}}
.searchbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}.searchbar label{display:flex;flex:1;flex-direction:column;gap:5px;color:var(--muted);min-width:180px;font-size:12px}.searchbar input{width:100%}.filters{margin-top:12px}.filters[hidden]{display:none}.grid.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.grid.large{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}@media(max-width:640px){.grid.large{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
/* Keep the original borderless lightbox and independent right-hand information panel. */
#viewer{position:fixed;inset:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;margin:0;padding:0;border:0;border-radius:0;background:#000d;overflow:hidden;color:#ece8f5}
#viewer[open]{display:flex}#viewerStage{display:flex;flex:1;min-width:0;align-items:center;justify-content:center;cursor:zoom-out;padding:0}
#viewerStage img{display:block;max-width:100%;max-height:100vh;width:auto;height:auto;margin:0;border:0;border-radius:0;cursor:default}
#viewerControls{position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:10px;z-index:2}
#viewerControls button,#viewerControls a,.viewer-arrow{background:#1d1b27e8;color:#ece8f5;border:1px solid #ffffff30;border-radius:8px;padding:7px 12px;text-decoration:none}
#viewerInfo{flex:0 0 min(380px,44vw);width:min(380px,44vw);height:100%;overflow:auto;padding:68px 18px 28px;background:var(--panel);color:var(--text);text-align:left}
#viewerInfo[hidden]{display:none}#viewerInfo pre{max-height:none}#viewerInfo .chip{padding:0;border:0;border-radius:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
#viewerInfo .meta-row{display:flex;gap:10px;margin:5px 0;overflow-wrap:anywhere}#viewerInfo .meta-row>span:first-child{color:var(--muted);flex:0 0 3em}
#copyPrompt{margin-top:12px;padding:4px 10px;font-size:12px}#viewerStatus{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#0009;color:#eee;border-radius:6px;padding:3px 10px;pointer-events:none;font-size:12px;white-space:nowrap}
.viewer-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:24px;z-index:1}#viewerPrev{left:12px}#viewerNext{right:12px}#viewerStage{position:relative}
@media(max-width:640px){#viewer[open]{flex-direction:column}#viewerInfo{flex:0 0 40vh;width:100%;height:40vh;padding:12px 16px}#viewerStage{height:100%;min-height:0;padding:54px 0 32px}#viewerStage img{max-height:100%;max-width:100%}#viewerControls{top:8px;right:8px;gap:6px}#viewerStatus{font-size:11px}#viewerControls button,#viewerControls a{padding:6px 9px}}
</style></head><body>
<header><h1>图片库</h1><nav><a href="/view/index.html">资料总览</a><a href="/view/knowledge.html">群知识</a><a href="/view/resources.html">资源链接</a><a href="/view/files.html">群文件</a></nav><button id="theme" aria-label="切换浅色或深色主题">切换主题</button></header>
<main><form id="filters"><div class="searchbar">
<label class="wide">搜索图片编号、发送者、提示词或讨论<input name="keyword" type="search" placeholder="输入关键词后搜索" maxlength="250"></label>
<button class="primary" type="submit">搜索 / 刷新</button><button id="filterToggle" type="button" aria-controls="advancedFilters" aria-expanded="false">筛选</button><button type="reset">重置</button></div>
<div id="advancedFilters" class="filters" hidden><label>分类<select name="category"><option value="">全部归档（不含候选）</option></select></label>
<label>群组<select name="scope"><option value="">全部群组</option></select></label>
<label>发送者<select name="user"><option value="">全部发送者</option></select></label>
<label>生成工具<select name="source"><option value="">全部工具</option></select></label>
<label>方向<select name="orientation"><option value="">不限方向</option><option value="landscape">横图</option><option value="portrait">竖图</option><option value="square">方图</option></select></label>
<label>最小短边<select name="min_side"><option value="0">不限尺寸</option><option>512</option><option>768</option><option>1024</option><option>1536</option><option>2048</option></select></label>
<label>开始日期<input name="since" type="date"></label><label>结束日期<input name="until" type="date"></label>
<label>排序<select name="sort"><option value="newest">最新记录</option><option value="oldest">最早记录</option><option value="pixels">分辨率从高到低</option><option value="size">文件从大到小</option></select></label>
<label class="check"><input name="dup_only" type="checkbox" value="1">仅重复内容或同工作流</label>
<label class="check"><input id="mask" type="checkbox" checked>遮罩混淆还原图</label>
</div></form>
<div class="toolbar"><span id="summary" class="muted" role="status" aria-live="polite">正在读取图片库…</span><label for="thumbSize">缩略图</label><select id="thumbSize"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select><button id="export">导出当前筛选</button></div>
<div id="grid" class="grid"></div><div id="empty" class="empty" hidden></div>
<div class="pager"><button id="prev">上一页</button><span id="page">第 1 页</span><button id="next">下一页</button></div>
</main><footer>直接读取归档数据库 · 图片预览使用缩略图缓存 · 原图集中保存</footer>
<dialog id="viewer" aria-label="原图查看"><div id="viewerStage"><img alt="原图预览"><button id="viewerPrev" class="viewer-arrow" type="button" aria-label="上一张">‹</button><button id="viewerNext" class="viewer-arrow" type="button" aria-label="下一张">›</button><span id="viewerStatus" aria-live="polite"></span></div><div id="viewerControls"><button id="toggleInfo" type="button" aria-controls="viewerInfo" aria-expanded="false">信息（I）</button><a target="_blank" rel="noopener" id="original">打开原图</a><button id="closeViewer" type="button" aria-label="关闭原图查看">关闭</button></div><aside id="viewerInfo" class="info" hidden><div id="viewerDetails"></div><button id="copyPrompt" type="button" disabled>复制提示词</button></aside></dialog>
<dialog id="exportDialog"><h2>导出当前筛选的图片</h2><p class="muted">按当前条件导出全部匹配图片，自动按内容去重。文件默认复制到目标目录。</p><form id="exportForm"><label>目标文件夹（留空使用默认导出目录）<input name="out_dir" style="width:100%" placeholder="D:\datasets\my-lora"></label><label><input name="no_captions" type="checkbox">不生成提示词 caption</label><label><input name="dry_run" type="checkbox" checked>仅统计，不写文件</label><button class="primary" id="startExport">开始</button></form><p id="exportStatus" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="closeExport">关闭</button></div></dialog>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s), form=$('#filters'), grid=$('#grid');let page=1,total=0,token='',generation=0,current=[],activeQuery={},pollTimer;
const names=['keyword','category','scope','user','source','orientation','min_side','since','until','sort'];
const params=new URLSearchParams(location.search);for(const n of names)if(params.has(n))form.elements[n].value=params.get(n);form.elements.dup_only.checked=params.get('dup_only')==='1';page=Math.max(1,Number(params.get('page'))||1);
try{$('#mask').checked=localStorage.getItem('maskRestored')!=='0'}catch{}
$('#advancedFilters').hidden=true;
$('#filterToggle').onclick=()=>{const advanced=$('#advancedFilters');advanced.hidden=!advanced.hidden;$('#filterToggle').setAttribute('aria-expanded',String(!advanced.hidden))};
function applyThumbSize(value){$('#thumbSize').value=['small','medium','large'].includes(value)?value:'medium';grid.className='grid '+$('#thumbSize').value;for(const card of grid.children)layoutCard(card)}
try{applyThumbSize(localStorage.getItem('galleryThumb'))}catch{}
$('#thumbSize').onchange=()=>{applyThumbSize($('#thumbSize').value);try{localStorage.setItem('galleryThumb',$('#thumbSize').value)}catch{}};

function filters(){const q={};for(const n of names)if(form.elements[n].value)q[n]=form.elements[n].value;if(form.elements.dup_only.checked)q.dup_only='1';return q}
async function api(url,options){const r=await fetch(url,options);let d;try{d=await r.json()}catch{throw Error('图库服务暂时不可用，请确认机器人已启动')}if(!r.ok)throw Error(d.error||'请求失败');return d}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function meta(){const m=await api('/api/gallery/meta');token=m.token;const selections={category:m.categories.map(x=>({value:x.name,label:x.name,count:x.count})),scope:m.scopes,user:m.users,source:m.sources};for(const [name,items]of Object.entries(selections)){const sel=form.elements[name],value=sel.value||params.get(name)||'';while(sel.options.length>1)sel.remove(1);for(const item of items)sel.add(new Option((item.label||item.value)+' · '+item.count,item.value));if(value&&!Array.from(sel.options).some(o=>o.value===value))sel.add(new Option(value,value));sel.value=value}}
let viewing=-1,detailVersion=0,infoPrompt='',moving=false,scrollBefore='';
const detailsCache=new Map(),viewer=$('#viewer'),viewerInfo=$('#viewerInfo');
function setInfo(open){viewerInfo.hidden=!open;$('#toggleInfo').setAttribute('aria-expanded',String(open));$('#toggleInfo').textContent=open?'收起信息（I）':'信息（I）';if(open)void loadDetails()}
function infoFilter(name,value){if(!value)return;form.elements[name].value=value;viewer.close();page=1;void load()}
function renderInfo(item,detail={}){
  const box=$('#viewerDetails');box.replaceChildren();
  function row(label,value,filter){if(!value)return;const line=node('div',undefined,'meta-row');line.append(node('span',label));const content=node(filter?'button':'span',String(value),filter?'chip':'');if(filter){content.type='button';content.onclick=()=>infoFilter(...filter)}line.append(content);box.append(line)}
  row('编号','#'+item.id);row('文件',detail.filename);row('用户',item.user_id,['user',item.user_id]);row('群组',item.scope,['scope',item.scope]);row('时间',(item.seen_at||'')+' UTC');row('尺寸',(item.width||'?')+' × '+(item.height||'?'));row('大小',item.size?(item.size/1048576).toFixed(2)+' MB':'');row('来源',item.ai_source,['source',item.ai_source]);row('分类',item.category||item.context_category,['category',item.category||item.context_category]);
  infoPrompt=detail.prompt||item.bound_prompt||'';$('#copyPrompt').disabled=!infoPrompt;$('#copyPrompt').textContent='复制提示词';
  const seen=new Set();for(const [label,text]of [['提示词',infoPrompt],['讨论',item.discussion_text],['元数据摘录',item.text_excerpt]]){if(!text||seen.has(text))continue;seen.add(text);box.append(node('p',label,'meta'),node('pre',text))}
  if(detail.error)box.append(node('p',detail.error,'muted'));
}
async function loadDetails(){
  const item=current[viewing],version=detailVersion;if(!item)return;
  try{let request=detailsCache.get(item.id);if(!request){request=api('/api/gallery/images/'+encodeURIComponent(item.id));detailsCache.set(item.id,request);request.catch(()=>detailsCache.delete(item.id))}const detail=await request;if(version===detailVersion&&viewer.open)renderInfo(item,detail)}catch(e){if(version===detailVersion&&viewer.open)renderInfo(item,{error:'提示词详情暂时不可用：'+e.message})}
}
function preview(item,reset=true){
  viewing=current.indexOf(item);detailVersion++;viewer.querySelector('img').src=item.url;$('#original').href=item.url;
  $('#viewerStatus').textContent=((page-1)*60+viewing+1)+' / '+total+' · Esc 关闭 · ←/→ 切换 · I 信息';
  renderInfo(item);if(reset)setInfo(false);else if(!viewerInfo.hidden)void loadDetails();if(!viewer.open){scrollBefore=document.documentElement.style.overflow;document.documentElement.style.overflow='hidden';viewer.showModal()}
}
async function adjacent(delta){
  if(moving||viewing<0||!viewer.open||!total)return;
  const index=((page-1)*60+viewing+delta+total)%total,targetPage=Math.floor(index/60)+1,version=detailVersion;
  if(targetPage!==page){moving=true;const oldPage=page;page=targetPage;const ok=await load(activeQuery);moving=false;if(!ok){page=oldPage;return}if(!viewer.open||version!==detailVersion)return}
  const item=current[index%60];if(item)preview(item,false);
}
$('#toggleInfo').onclick=()=>setInfo(viewerInfo.hidden);
$('#viewerPrev').onclick=()=>void adjacent(-1);$('#viewerNext').onclick=()=>void adjacent(1);
$('#copyPrompt').onclick=async()=>{const prompt=infoPrompt,version=detailVersion;try{await navigator.clipboard.writeText(prompt);if(version===detailVersion)$('#copyPrompt').textContent='已复制'}catch{if(version===detailVersion)$('#copyPrompt').textContent='复制失败，请选中文字复制'}};
viewer.onclick=e=>{if(e.target===viewer||e.target===$('#viewerStage'))viewer.close()};
window.addEventListener('keydown',e=>{if(!viewer.open||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName||''))return;if(e.key==='Escape'){e.preventDefault();viewer.close()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();void adjacent(e.key==='ArrowLeft'?-1:1)}else if(e.key.toLowerCase()==='i'){e.preventDefault();setInfo(viewerInfo.hidden)}});
function layoutCard(card){const height=card.querySelector('img').getBoundingClientRect().height;if(height)card.style.gridRowEnd='span '+Math.ceil((height+10)/18)}
window.addEventListener('resize',()=>{for(const card of grid.children)layoutCard(card)});
function render(items){grid.replaceChildren();for(const item of items){const card=node('article',undefined,'card'),button=node('button',undefined,'preview'),img=node('img');button.type='button';button.setAttribute('aria-label','查看图片 #'+item.id);if(item.width&&item.height){img.width=item.width;img.height=item.height}img.src=item.thumbnail;img.loading='lazy';img.decoding='async';img.onload=()=>layoutCard(card);img.alt='图片 #'+item.id;img.onerror=()=>{img.alt='原图不可用，请尝试修复图片 #'+item.id};button.append(img);if(item.deobfuscated&&$('#mask').checked)button.classList.add('masked');button.onclick=()=>{if(button.classList.contains('masked'))button.classList.remove('masked');else preview(item)};card.append(button);grid.append(card);if(img.complete)layoutCard(card)}}
async function load(q=filters()){const run=++generation;$('#summary').textContent='正在查询…';$('#prev').disabled=$('#next').disabled=true;$('#export').disabled=true;try{const p=new URLSearchParams({...q,page:String(page),page_size:'60'});const d=await api('/api/gallery/images?'+p);if(run!==generation)return;activeQuery={...q};total=d.total;current=d.items;render(current);$('#summary').textContent='找到 '+total.toLocaleString()+' 张图片 · 本页 '+current.length+' 张';$('#page').textContent='第 '+page+' / '+Math.max(1,Math.ceil(total/60))+' 页';$('#prev').disabled=page<=1;$('#next').disabled=!d.has_more;$('#empty').hidden=!!current.length;$('#empty').textContent='没有符合条件的图片，试试调整筛选。';history.replaceState(null,'','?'+p);$('#export').disabled=false;return true}catch(e){if(run!==generation)return;grid.replaceChildren();$('#empty').hidden=false;$('#empty').textContent=e.message;$('#summary').textContent='读取失败';return false;}}
form.onsubmit=e=>{e.preventDefault();if(viewer.open)viewer.close();page=1;load()};form.onreset=()=>{setTimeout(()=>{page=1;load()},0)};$('#prev').onclick=()=>{page--;load(activeQuery);window.scrollTo(0,0)};$('#next').onclick=()=>{page++;load(activeQuery);window.scrollTo(0,0)};$('#mask').onchange=()=>{try{localStorage.setItem('maskRestored',$('#mask').checked?'1':'0')}catch{}render(current)};$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('viewTheme',t)}catch{}};$('#closeViewer').onclick=()=>$('#viewer').close();viewer.addEventListener('close',()=>{detailVersion++;viewing=-1;document.documentElement.style.overflow=scrollBefore;setInfo(false);viewer.querySelector('img').removeAttribute('src')});
let exportQuery={};$('#export').onclick=()=>{exportQuery={...activeQuery};$('#exportStatus').textContent='按当前已显示的筛选导出，命中 '+total+' 张；导出时以数据库最新结果为准。未提交的筛选修改请先点击搜索。';$('#exportDialog').showModal()};$('#closeExport').onclick=()=>$('#exportDialog').close();$('#exportForm').onsubmit=async e=>{e.preventDefault();$('#startExport').disabled=true;clearTimeout(pollTimer);try{const f=$('#exportForm').elements;await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,gallery_query:exportQuery,out_dir:f.out_dir.value,no_captions:f.no_captions.checked,dry_run:f.dry_run.checked})});await poll()}catch(e){$('#exportStatus').textContent=e.message;$('#startExport').disabled=false}};
async function poll(){try{const s=await api('/api/export/status');if(s.status==='running'){$('#exportStatus').textContent='正在处理导出…';pollTimer=setTimeout(poll,1000);return}const m=s.summary;$('#exportStatus').textContent=m?(m.dry_run?'统计完成':'导出完成')+'：'+m.counts.selected+' 张\n'+(m.out||''):(s.log_tail||['导出失败']).slice(-5).join('\n');$('#startExport').disabled=false}catch(e){$('#exportStatus').textContent=e.message;$('#startExport').disabled=false}}
window.addEventListener('popstate',()=>location.reload());meta().then(load).catch(e=>{$('#summary').textContent=e.message});
})();
</script></body></html>
